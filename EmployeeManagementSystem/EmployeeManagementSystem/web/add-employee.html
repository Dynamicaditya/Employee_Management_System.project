<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Employee - Employee Management System</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <h1>Employee Management System</h1>
    <nav><a href="dashboard.html">Dashboard</a><a href="login.html">Logout</a></nav>
</header>

<div class="layout">
    <div class="sidebar">
        <a href="dashboard.html">Dashboard</a>
        <a href="employee.html" class="active">Employees</a>
        <a href="departments.html">Departments</a>
        <a href="designations.html">Designations</a>
        <a href="leave.html">Leave Requests</a>
        <a href="salary.html">Salary</a>
        <a href="reports.html">Reports</a>
    </div>

    <div class="content">
        <h2 style="margin-bottom:16px;">Add / Edit Employee</h2>

        <!-- Submits to EmployeeService.addEmployee() / updateEmployee() in Java.
             required, type="email", min="0", type="date" give basic browser-level
             validation with plain HTML attributes - no JavaScript needed. -->
        <form class="form-box">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="departmentId">
                    <option value="1">IT</option>
                    <option value="2">HR</option>
                    <option value="3">Finance</option>
                    <option value="4">Marketing</option>
                    <option value="5">Sales</option>
                </select>
            </div>
            <div class="form-group">
                <label for="designation">Designation</label>
                <select id="designation" name="designationId">
                    <option value="1">Software Developer</option>
                    <option value="2">HR Executive</option>
                    <option value="3">Accountant</option>
                    <option value="4">Manager</option>
                    <option value="5">Sales Executive</option>
                </select>
            </div>
            <div class="form-group">
                <label for="joiningDate">Joining Date</label>
                <input type="date" id="joiningDate" name="joiningDate" required>
            </div>
            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="number" id="salary" name="salary" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option>Active</option>
                    <option>Inactive</option>
                </select>
            </div>

            <button type="submit" class="btn">Save Employee</button>
            <a href="employee.html" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<footer>&copy; 2026 Employee Management System</footer>
</body>
</html>
